name: Publish Between the Lines public demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4
      - name: Bundle self-hosted PDF.js parser for private browser imports
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/btl-pdfjs" --no-save --omit=optional --ignore-scripts --no-audit --no-fund pdfjs-dist@4.10.38
          mkdir -p demo/vendor
          cp "$RUNNER_TEMP/btl-pdfjs/node_modules/pdfjs-dist/build/pdf.min.mjs" demo/vendor/pdf.min.mjs
          cp "$RUNNER_TEMP/btl-pdfjs/node_modules/pdfjs-dist/build/pdf.worker.min.mjs" demo/vendor/pdf.worker.min.mjs
          cp "$RUNNER_TEMP/btl-pdfjs/node_modules/pdfjs-dist/LICENSE" demo/vendor/LICENSE-PDFJS.txt
          test -s demo/vendor/pdf.min.mjs
          test -s demo/vendor/pdf.worker.min.mjs
      - name: Check demo assets and privacy boundary
        shell: bash
        run: |
          test -f index.html
          test -f demo/index.html
          test -f demo/data.js
          test -f demo/demo.js
          test -f CNAME
          test "$(cat CNAME)" = 'btl.masynnay.com'
          if find . -type f \( -iname '*.pdf' -o -iname '*.sqlite*' -o -iname '*.db' -o -iname '*.env' -o -iname '*.zip' -o -iname '*.gguf' \) | grep .; then
            echo 'Private application asset in public site' >&2
            exit 1
          fi
          node --check app.js
          node --check demo/data.js
          node --check demo/demo.js
          node --check demo/import-engine.js
          node tests/local-import.test.cjs
          node tests/demo.test.cjs
          python3 tests/verify_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
