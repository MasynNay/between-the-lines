name: Validate Between the Lines public demo
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public source only
        uses: actions/checkout@v4
      - name: Validate static code and source/privacy tests
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check demo/data.js
          node --check demo/demo.js
          node --check demo/import-engine.js
          node tests/local-import.test.cjs
          node tests/privacy-workflow.test.cjs
          node tests/demo.test.cjs
          python3 tests/verify_site.py
      - name: Bundle the production PDF.js worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/btl-pdfjs" --no-save --omit=optional --ignore-scripts --no-audit --no-fund pdfjs-dist@4.10.38
          mkdir -p demo/vendor
          cp "$RUNNER_TEMP/btl-pdfjs/node_modules/pdfjs-dist/build/pdf.min.mjs" demo/vendor/pdf.min.mjs
          cp "$RUNNER_TEMP/btl-pdfjs/node_modules/pdfjs-dist/build/pdf.worker.min.mjs" demo/vendor/pdf.worker.min.mjs
      - name: Test real PDF imports, citations, privacy, and keyboard focus in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/btl-smoke" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/btl-smoke/node_modules/playwright-core" node tests/pdf-browser-smoke.cjs
